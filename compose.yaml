# WeFarm services. Key files live at the outer workspace root, outside every Git repository,
# and are mounted only into the services that need them.
secrets:
  world_labs_api_key:
    file: ${WEFARM_WORKSPACE:-..}/.env.secrets.worldlabs

x-python-service: &python-service
  build: .
  working_dir: /app
  environment:
    RUNS_ROOT: /runs
    DATA_ROOT: /data
  volumes:
    - .:/app
    - ${RUNS_ROOT:-./runs}:/runs
    - ${DATA_ROOT:-./data}:/data

services:
  # World generation and measurement (World Labs key mounted here only).
  jobs:
    <<: *python-service
    environment:
      RUNS_ROOT: /runs
      DATA_ROOT: /data
      WORLDLABS_MAX_CREDITS: ${WORLDLABS_MAX_CREDITS:-}
    command: ["python", "-c", "print('jobs: pass a command, e.g. python -m wefarm.<module>')"]
    secrets:
      - world_labs_api_key

  # Vite dev server for the browser simulator, on the host's loopback interface only.
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    working_dir: /app/web
    volumes:
      - .:/app
      - /app/web/node_modules
      - ${DATA_ROOT:-./data}:/data:ro
    ports:
      - "127.0.0.1:${WEB_DEV_PORT:-5180}:5173"
    environment:
      # The marketplace this simulator talks to for AI Mode and free-play uploads (same compose project).
      VITE_WEFARM_API_BASE: http://127.0.0.1:${MARKETPLACE_PORT:-8765}
    command: ["npm", "run", "dev"]

  # Marketplace web app (requester, player, QA, Data Miner) on the host's loopback interface only.
  # Only this service gets the marketplace keys (OpenRouter, Crusoe, Neo4j); the file is optional.
  marketplace:
    build:
      context: .
      dockerfile: docker/marketplace.Dockerfile
    working_dir: /app
    env_file:
      - path: ${WEFARM_WORKSPACE:-..}/.env.secrets.marketplace
        required: false
    environment:
      WEFARM_GAME_URL: http://127.0.0.1:${WEB_DEV_PORT:-5180}/
      WEFARM_DATA_ROOT: /app/runs/wefarm
      # 1 = replay stored OpenRouter answers (agriphilo/demo_cache.json) instead of live calls; 0 = live.
      WEFARM_DEMO_CACHE: ${WEFARM_DEMO_CACHE:-1}
      # In demo mode, 1 = episode QA still asks OpenRouter live (in the background); 0 = stored answer only.
      WEFARM_DEMO_LIVE_QA: ${WEFARM_DEMO_LIVE_QA:-1}
    volumes:
      - .:/app
      - /app/web/node_modules
    ports:
      - "127.0.0.1:${MARKETPLACE_PORT:-8765}:8765"
    command: ["python", "-m", "agriphilo.web", "--host", "0.0.0.0", "--port", "8765", "--demo"]
