# WeFarm services. Key files live at the outer workspace root, outside every Git repository,
# and are mounted only into the services that need them.
secrets:
  world_labs_api_key:
    file: ${WEFARM_WORKSPACE:-..}/.env.secrets.worldlabs

x-python-service: &python-service
  build: .
  working_dir: /app
  environment:
    RUNS_ROOT: /runs
    DATA_ROOT: /data
  volumes:
    - .:/app
    - ${RUNS_ROOT:-./runs}:/runs
    - ${DATA_ROOT:-./data}:/data

services:
  # World generation and measurement (World Labs key mounted here only).
  jobs:
    <<: *python-service
    environment:
      RUNS_ROOT: /runs
      DATA_ROOT: /data
      WORLDLABS_MAX_CREDITS: ${WORLDLABS_MAX_CREDITS:-}
    command: ["python", "-c", "print('jobs: pass a command, e.g. python -m wefarm.<module>')"]
    secrets:
      - world_labs_api_key

  # Vite dev server for the browser simulator, on the host's loopback interface only.
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    working_dir: /app/web
    volumes:
      - .:/app
      - /app/web/node_modules
      - ${DATA_ROOT:-./data}:/data:ro
    ports:
      - "127.0.0.1:${WEB_DEV_PORT:-5180}:5173"
    command: ["npm", "run", "dev"]
